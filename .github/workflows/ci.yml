name: CUSTODIA CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable tests and installed distributions / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      CUSTODIA_INTEGRATION: '0'
      CUSTODIA_TEST_GHIDRA: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build 'setuptools>=77' wheel
      - name: Run portable source tests
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build source and wheel distributions
        run: python -m build --outdir dist
      - name: Test each installed distribution outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            case "$artifact" in
              *.whl) kind=wheel ;;
              *.tar.gz) kind=sdist ;;
              *) exit 1 ;;
            esac
            artifact_path="$(realpath "$artifact")"
            test_env="$RUNNER_TEMP/custodia-env-$kind"
            outside="$RUNNER_TEMP/custodia-acceptance-$kind"
            python -m venv "$test_env"
            "$test_env/bin/python" -m pip install --disable-pip-version-check 'setuptools>=77' wheel
            "$test_env/bin/python" -m pip install --disable-pip-version-check --no-index --no-deps --no-build-isolation "$artifact_path"
            mkdir -p "$outside"
            cp tests/installed_acceptance.py "$outside/acceptance.py"
            (
              cd "$outside"
              env -u PYTHONPATH -u PYTHONHOME "$test_env/bin/python" -B -I acceptance.py
            )
          done
